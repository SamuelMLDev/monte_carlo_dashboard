[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "monte-carlo-research-lab"
version = "0.3.0"
description = "Local-first research-grade Monte Carlo simulation laboratory"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scipy>=1.11,<2",
  "statsmodels>=0.14,<1",
  "scikit-learn>=1.4,<2",
  "matplotlib>=3.8,<4",
  "streamlit>=1.48,<2",
  "PyYAML>=6,<7",
  "Jinja2>=3.1,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.7,<1",
  "mypy>=1.11,<2",
]

[tool.setuptools.packages.find]
include = ["mc_lab*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py310"
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
